<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Carte lissée ETS2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<script src="lib/maplibre-gl.js"></script><script src="lib/pmtiles.js"></script>
<style>
html,body,#map{margin:0;height:100%;background:#1e1f24;font:14px system-ui,sans-serif}
#panel{position:absolute;top:10px;left:10px;background:#2a2c33ee;color:#e6e6e6;padding:10px 14px;border-radius:8px;z-index:2;max-width:260px}
#panel h3{margin:0 0 6px;font-size:15px}#panel label{display:block;margin:3px 0;cursor:pointer}
#panel hr{border:0;border-top:1px solid #444;margin:8px 0}#panel button{margin:2px 4px 2px 0;background:#3a3d46;color:#eee;border:1px solid #555;border-radius:4px;padding:3px 7px;cursor:pointer}
#z{opacity:.6;font-size:12px}
</style></head><body><div id="map"></div>
<div id="panel"><h3>Carte ETS2 1.61</h3>
<label><input type="radio" name="v" value="new" checked> Nouvelle (lissée)</label>
<label><input type="radio" name="v" value="old"> Actuelle</label><hr>
<label><input type="checkbox" id="c-lanes" checked> Voies IA (prefabs)</label>
<label><input type="checkbox" id="c-paths" checked> Chemins du jeu (prefabs)</label>
<label><input type="checkbox" id="c-plaza" checked> Péages en plateforme</label>
<label><input type="checkbox" id="c-shapes" checked> Formes du jeu (cabines, parkings)</label>
<label><input type="checkbox" id="c-hull"> Grandes zones des prefabs</label>
<label><input type="checkbox" id="c-dots"> Points des tracés</label><hr>
<button data-go="3.885,43.722,14">Échangeur Montpellier</button><button data-go="3.3675,43.4952,14.3">Péage A9</button>
<div id="z"></div><div id="pos" style="font-size:12px;margin-top:4px;opacity:.85">Clique sur la carte pour copier la position</div></div>
<script>
const proto = new pmtiles.Protocol(); maplibregl.addProtocol('pmtiles', proto.tile);
const M = 3.562e-4; // pixels par mètre de jeu au zoom 0 (tuiles 512)
const meters = w => ['interpolate',['exponential',2],['zoom'],6,['max',0.6,['*',w,M*64]],20,['*',w,M*1048576]];
const lanes = ['case',['in',['get','roadType'],['literal',['freeway','divided']]],
  ['max',['coalesce',['get','leftLanes'],1],['coalesce',['get','rightLanes'],1],1],
  ['max',['+',['coalesce',['get','leftLanes'],1],['coalesce',['get','rightLanes'],1]],1]];
// Mêmes épaisseurs que la carte live du site (web/src/app/map/utils/map-style.ts).
const ROAD_W = ['interpolate',['exponential',1.5],['zoom'],3,0.8,14,30,16,150];
const LANE_W = ['interpolate',['exponential',1.5],['zoom'],3,0.5,14,17,16,85];
const roadColor = ['match',['get','roadType'],'freeway','#e8a33d','divided','#e8c86b','#cfd3da'];
const shapeColor = ['match',['get','color'],0,'#cfd3da',1,'#9aa0aa',2,'#4a4e57',3,'#2c3a30','#888'];
function layersFor(src, p) {
  return [
    {id:p+'area',type:'fill',source:src,'source-layer':'ets2',filter:['==',['get','type'],'mapArea'],paint:{'fill-color':shapeColor,'fill-opacity':.5}},
    {id:p+'hull',type:'fill',source:src,'source-layer':'ets2',filter:['all',['==',['get','type'],'prefab'],['==',['get','color'],3]],paint:{'fill-color':'#2c3a30'},layout:{visibility:'none'}},
    {id:p+'road',type:'line',source:src,'source-layer':'ets2',filter:['all',['==',['get','type'],'road'],['!=',['coalesce',['get','pf'],0],1]],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':roadColor,'line-width':ROAD_W}},
    {id:p+'path',type:'line',source:src,'source-layer':'ets2',filter:['all',['==',['get','type'],'road'],['==',['coalesce',['get','pf'],0],1]],
      layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':roadColor,'line-width':ROAD_W}},
    {id:p+'shape',type:'fill',source:src,'source-layer':'ets2',filter:['all',['==',['get','type'],'prefab'],['!=',['get','color'],3]],paint:{'fill-color':shapeColor}},
    {id:p+'ferry',type:'line',source:src,'source-layer':'ets2',filter:['==',['get','type'],'ferry'],paint:{'line-color':'#4af','line-dasharray':[2,2]}},
  ];
}
const style = {version:8,sources:{
  world:{type:'vector',url:'pmtiles://tiles/world.pmtiles'},
  neu:{type:'vector',url:'pmtiles://tiles/ets2-lisse.pmtiles'},
  old:{type:'vector',url:'pmtiles://tiles/ets2.pmtiles'},
  lanes:{type:'vector',url:'pmtiles://tiles/voies-ia.pmtiles'}},
 layers:[{id:'bg',type:'background',paint:{'background-color':'#1e1f24'}},
  {id:'water',type:'fill',source:'world','source-layer':'water',paint:{'fill-color':'#16303f'}},
  ...layersFor('old','o-'), ...layersFor('neu','n-'),
  {id:'n-plaza',type:'fill',source:'neu','source-layer':'plazas',paint:{'fill-color':'#e8a33d'}},
  {id:'n-plaza-l',type:'line',source:'neu','source-layer':'plazas',maxzoom:11,paint:{'line-color':'#e8a33d','line-width':['interpolate',['linear'],['zoom'],6,1,10,2]}},
  {id:'n-lanes',type:'line',source:'lanes','source-layer':'lanes',minzoom:10,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':roadColor,'line-width':LANE_W}},
  {id:'n-shape-top',type:'fill',source:'neu','source-layer':'ets2',filter:['all',['==',['get','type'],'prefab'],['in',['get','color'],['literal',[1,2]]]],paint:{'fill-color':shapeColor}},
  {id:'dots',type:'circle',source:'neu','source-layer':'ets2',filter:['==',['get','type'],'road'],minzoom:12,layout:{visibility:'none'},paint:{'circle-radius':2,'circle-color':'#ff3d7f'}},
  {id:'dots-l',type:'circle',source:'lanes','source-layer':'lanes',minzoom:12,layout:{visibility:'none'},paint:{'circle-radius':1.5,'circle-color':'#7ee0a0'}},
 ]};
const map = new maplibregl.Map({container:'map',style,center:[3.885,43.722],zoom:13,maxZoom:19,hash:true});
map.addControl(new maplibregl.NavigationControl(),'top-right');
const vis = (id,on) => map.getLayer(id) && map.setLayoutProperty(id,'visibility',on?'visible':'none');
function apply(){
  const neu = document.querySelector('input[name=v]:checked').value==='new';
  const g = id => document.getElementById(id).checked;
  for (const l of map.getStyle().layers) {
    if (l.id.startsWith('o-')) vis(l.id, !neu && (l.id!=='o-hull' || g('c-hull')));
    if (l.id.startsWith('n-')) vis(l.id, neu);
  }
  if (neu) {
    vis('n-lanes', g('c-lanes')); vis('n-plaza', g('c-plaza')); vis('n-plaza-l', g('c-plaza')); vis('n-path', g('c-paths'));
    vis('n-shape', g('c-shapes')); vis('n-shape-top', g('c-shapes')); vis('n-hull', g('c-hull'));
  }
  vis('dots', g('c-dots')); vis('dots-l', g('c-dots') && neu && g('c-lanes'));
}
map.on('load', () => { apply(); document.querySelectorAll('#panel input').forEach(i => i.onchange = apply); });
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const [x,y,z]=b.dataset.go.split(',').map(Number); map.jumpTo({center:[x,y],zoom:z}); });
map.on('click', e => {
  const t = `${e.lngLat.lng.toFixed(5)},${e.lngLat.lat.toFixed(5)},${map.getZoom().toFixed(1)}`;
  document.getElementById('pos').textContent = t + ' (copié)';
  navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {});
});
map.on('zoom', () => document.getElementById('z').textContent = 'zoom ' + map.getZoom().toFixed(1));
</script></body></html>
